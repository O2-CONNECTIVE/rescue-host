[package]
name = "rescue-host-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
serde_json = "=1.0.154"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
harness = false
