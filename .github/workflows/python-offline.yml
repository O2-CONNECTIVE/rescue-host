name: Python offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Check Python and Tkinter import
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"
      - name: Run existing offline tests and report skips
        shell: python
        run: |
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(
              f'Offline tests: run={result.testsRun}, skipped={len(result.skipped)}, '
              f'failures={len(result.failures)}, errors={len(result.errors)}',
              flush=True,
          )
          sys.exit(0 if result.wasSuccessful() and result.testsRun > 0 else 1)
      - name: Compile Python source and tests
        run: python -m compileall -q src tests
