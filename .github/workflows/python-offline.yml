name: Python offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Check Python and Tkinter import
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"
      - name: Run existing offline tests and syntax through development entry
        run: python scripts/dev.py check
      - name: Validate published design tokens
        run: python scripts/dev.py tokens
      - name: Verify development-tool and token-checker fixtures
        run: python -m unittest discover -s scripts/tests -v
      - name: Temporary expected token-failure propagation probe
        if: matrix.os == 'ubuntu-24.04'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(prefix='rescue-ci-token-probe-') as temporary:
              root = Path(temporary)
              (root / 'scripts').mkdir()
              shutil.copy2('scripts/dev.py', root / 'scripts/dev.py')
              design = root / 'ui/tauri/design'
              design.mkdir(parents=True)
              for name in ('check_tokens.py', 'tokens.css', 'components.css', 'preview.css'):
                  shutil.copy2(Path('ui/tauri/design') / name, design / name)
              with (design / 'components.css').open('a', encoding='utf-8') as css:
                  css.write('\n.probe { color: var(--sys-probe-missing); }\n')
              result = subprocess.run([sys.executable, str(root / 'scripts/dev.py'), 'tokens'])
              print(f'Expected invalid-token probe exit: {result.returncode}', flush=True)
              sys.exit(result.returncode)
