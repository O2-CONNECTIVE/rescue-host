name: Python offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, wip/tether-public-pilot-20261101]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONUTF8: '1'
      SOURCE_SIZE_REPORT: .work/source-size-result.json
      SOURCE_SIZE_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require and record exact source checkout
        working-directory: ${{ github.workspace }}
        run: python scripts/check_ci_checkout.py
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Check Python and Tkinter import
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"
      - name: Run existing offline tests and syntax through development entry
        run: python scripts/dev.py check
      - name: Validate published design tokens
        run: python scripts/dev.py tokens
      - name: Check tracked UI source sizes
        run: python scripts/dev.py sizes
      - name: Verify source-size checker execution
        run: python scripts/check_source_sizes.py --verify-report
      - name: Verify development-tool and token-checker fixtures
        run: python -m unittest discover -s scripts/tests -v
      - name: Set up fixed Node for Worker source fixtures
        if: runner.os == 'Linux'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Verify closed-gate Worker fixtures without deployment
        if: runner.os == 'Linux'
        run: python scripts/check_tether_fixtures.py workers
