name: Python offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Check Python and Tkinter import
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"
      - name: Run existing offline tests and syntax through development entry
        run: python scripts/dev.py check
      - name: Verify development-tool failure handling
        run: python -m unittest discover -s scripts/tests -v
      - name: Temporary expected-failure propagation probe
        if: matrix.os == 'ubuntu-24.04'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(prefix='rescue-ci-exit-probe-') as temporary:
              root = Path(temporary)
              (root / 'scripts').mkdir()
              command = root / 'scripts/dev.py'
              shutil.copy2('scripts/dev.py', command)
              result = subprocess.run([sys.executable, str(command), 'check'])
              print(f'Expected missing-target probe exit: {result.returncode}', flush=True)
              sys.exit(result.returncode)
