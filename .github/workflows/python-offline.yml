name: Python offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONUTF8: '1'
      SOURCE_SIZE_REPORT: .work/source-size-result.json
      SOURCE_SIZE_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Check Python and Tkinter import
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"
      - name: Run existing offline tests and syntax through development entry
        run: python scripts/dev.py check
      - name: Validate published design tokens
        run: python scripts/dev.py tokens
      - name: Check tracked UI source sizes
        run: python scripts/dev.py sizes
      - name: Verify source-size checker execution
        run: python scripts/check_source_sizes.py --verify-report
      - name: Verify development-tool and token-checker fixtures
        run: python -m unittest discover -s scripts/tests -v
      - name: Diagnostic expected failure - finite oversized fixture
        shell: python
        run: |
          import os
          import subprocess
          import sys
          sys.path.insert(0, 'scripts/tests')
          from test_source_sizes import SourceSizeTests
          fixture = SourceSizeTests()
          try:
              fixture.setUp()
              fixture.write('ui/app.tsx', 'value\n' * 4)
              result = subprocess.run(
                  [sys.executable, str(fixture.root / 'scripts/dev.py'), 'sizes'],
                  cwd=fixture.root.parent, capture_output=True, text=True, timeout=30,
                  env=dict(os.environ, SOURCE_SIZE_REPORT=str(fixture.report), SOURCE_SIZE_NONCE='failure-probe'),
              )
              print(result.stdout)
              print(result.stderr)
              print('FINITE_SIZE_FAILURE_EXIT=' + str(result.returncode))
          finally:
              fixture.doCleanups()
          sys.exit(result.returncode)
