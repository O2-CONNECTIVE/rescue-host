name: Tauri startup diagnostic variant
on:
  pull_request:
    branches: [main]
    paths: ['ui/tauri/**', 'tools/native-driver-trace/**', 'scripts/*driver_trace.py', 'tools/wry-startup-trace/**', 'scripts/*wry_trace.py', 'tools/win32-pump-contract/**', 'scripts/tests/run_win32_pump_contract.py', 'tools/wry-creation-baseline/**', 'scripts/prepare_wry_baseline.py', 'scripts/tests/test_wry_baseline.py', '.github/workflows/tauri-startup-diagnostic.yml']
  push:
    branches: [main]
    paths: ['ui/tauri/**', 'tools/native-driver-trace/**', 'scripts/*driver_trace.py', 'tools/wry-startup-trace/**', 'scripts/*wry_trace.py', 'tools/win32-pump-contract/**', 'scripts/tests/run_win32_pump_contract.py', 'tools/wry-creation-baseline/**', 'scripts/prepare_wry_baseline.py', 'scripts/tests/test_wry_baseline.py', '.github/workflows/tauri-startup-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: tauri-startup-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  startup-diagnostic:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: [debug, release]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Test fixed classification and file boundary
        working-directory: ui/tauri
        run: node --test tests/app-startup-stages.test.ts tests/app-startup-files.test.ts tests/app-startup-cli.test.ts tests/wry-startup-stages.test.ts tests/wry-startup-files.test.ts
      - name: Test finite harness collection contract
        run: ./ui/tauri/native-smoke/app-startup-contract.test.ps1
      - name: Record exact diagnostic source and existing runtime
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw 'NATIVE_DIAGNOSTIC_SOURCE_INVALID' }
          "STARTUP_SOURCE=$sha" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/startup-target" >> $env:GITHUB_ENV
          ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:RUNNER_TEMP/startup-inventory.json"
      - name: Select existing fixed CI Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Prepare verified test-only Wry callback source
        run: |
          Invoke-WebRequest 'https://static.crates.io/crates/wry/wry-0.57.1.crate' -OutFile "$env:RUNNER_TEMP/wry.crate" -TimeoutSec 60
          Invoke-WebRequest 'https://static.crates.io/crates/webview2-com/webview2-com-0.39.1.crate' -OutFile "$env:RUNNER_TEMP/pump.crate" -TimeoutSec 60
          Invoke-WebRequest 'https://static.crates.io/crates/webview2-com-macros/webview2-com-macros-0.8.1.crate' -OutFile "$env:RUNNER_TEMP/macro.crate" -TimeoutSec 60
          python scripts/apply_wry_trace.py --archive "$env:RUNNER_TEMP/wry.crate" --pump-archive "$env:RUNNER_TEMP/pump.crate" --macro-archive "$env:RUNNER_TEMP/macro.crate" --bundle tools/wry-startup-trace --source "$env:RUNNER_TEMP/wry-startup-source" --app-lock ui/tauri/src-tauri/Cargo.lock --report "$env:RUNNER_TEMP/wry-prepared.json" --source-commit $env:STARTUP_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourcePath = "$env:RUNNER_TEMP/wry-startup-source".Replace('\', '/')
          "STARTUP_WRY_CONFIG=patch.crates-io.wry.path='$sourcePath'" >> $env:GITHUB_ENV
          rustc +1.99.1 --cfg test --edition 2021 tools/wry-startup-trace/fixture.rs -o "$env:RUNNER_TEMP/wry-probe-fixture.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/tests/run_wry_probe.py "$env:RUNNER_TEMP/wry-probe-fixture.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/tests/run_wry_provenance.py "$env:RUNNER_TEMP/wry.crate" "$env:RUNNER_TEMP/pump.crate" "$env:RUNNER_TEMP/macro.crate" tools/wry-startup-trace "$env:RUNNER_TEMP/wry-startup-source" ui/tauri/src-tauri/Cargo.lock $env:STARTUP_SOURCE
          exit $LASTEXITCODE
      - name: Distinguish sent callbacks from GetMessage returns on owned windows
        timeout-minutes: 3
        run: |
          python -I scripts/tests/run_win32_pump_contract.py "$env:RUNNER_TEMP/pump.crate" "$env:RUNNER_TEMP/win32-pump-contract.json"
          exit $LASTEXITCODE
      - name: Prepare pinned driver diagnostic source
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:RUNNER_TEMP/startup-tools" -InventoryPath "$env:RUNNER_TEMP/startup-inventory.json"
      - name: Build unchanged bundled frontend
        working-directory: ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Test and build explicit diagnostic feature
        working-directory: ui/tauri
        env:
          STARTUP_PROFILE: ${{ matrix.profile }}
        run: |
          cargo +1.99.1 test --locked --config $env:STARTUP_WRY_CONFIG --manifest-path src-tauri/Cargo.toml --features custom-protocol,startup-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $args = @('+1.99.1', 'build', '--locked', '--config', $env:STARTUP_WRY_CONFIG, '--manifest-path', 'src-tauri/Cargo.toml', '--features', 'custom-protocol,startup-diagnostics')
          if ($env:STARTUP_PROFILE -eq 'release') { $args += '--release' }
          & cargo @args
          exit $LASTEXITCODE
      - name: Bind source features and hash to isolated diagnostic fixture
        env:
          STARTUP_PROFILE: ${{ matrix.profile }}
        run: |
          $fixture = "$env:RUNNER_TEMP/startup-fixture"
          New-Item -ItemType Directory $fixture -ErrorAction Stop | Out-Null
          $exe = "$env:CARGO_TARGET_DIR/$env:STARTUP_PROFILE/rescue-host-shell.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/apply_wry_trace.py --verify --archive "$env:RUNNER_TEMP/wry.crate" --pump-archive "$env:RUNNER_TEMP/pump.crate" --macro-archive "$env:RUNNER_TEMP/macro.crate" --bundle tools/wry-startup-trace --source "$env:RUNNER_TEMP/wry-startup-source" --app-lock ui/tauri/src-tauri/Cargo.lock --report "$env:RUNNER_TEMP/wry-provenance.json" --source-commit $env:STARTUP_SOURCE --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = [ordered]@{
            schema = 1; variant = 'host-startup-diagnostic-1'; sourceCommit = $env:STARTUP_SOURCE
            features = @('custom-protocol', 'startup-diagnostics'); profile = $env:STARTUP_PROFILE
            exeSha256 = $hash; distribution = $false
          }
          Copy-Item -LiteralPath $exe -Destination "$fixture/rescue-host-shell.exe"
          [IO.File]::WriteAllText("$fixture/BUILD.json", ($manifest | ConvertTo-Json -Compress))
          if ($env:STARTUP_PROFILE -eq 'release') {
            # 通常配布packageとは別の、runner内だけの診断ZIP。
            Compress-Archive -Path "$fixture/*" -DestinationPath "$env:RUNNER_TEMP/startup-diagnostic-fixture.zip"
            Expand-Archive "$env:RUNNER_TEMP/startup-diagnostic-fixture.zip" -DestinationPath "$env:RUNNER_TEMP/startup-unpacked"
            $fixture = "$env:RUNNER_TEMP/startup-unpacked"
          }
          "STARTUP_EXE=$fixture/rescue-host-shell.exe" >> $env:GITHUB_ENV
          "STARTUP_MANIFEST=$fixture/BUILD.json" >> $env:GITHUB_ENV
          node ui/tauri/native-smoke/inspect-app-startup.ts --manifest "$fixture/BUILD.json" --exe "$fixture/rescue-host-shell.exe" --source $env:STARTUP_SOURCE --build-only
          exit $LASTEXITCODE
      - name: One native request with existing owned cleanup
        timeout-minutes: 3
        run: ./ui/tauri/native-smoke/supervise.ps1 -ToolsDirectory "$env:RUNNER_TEMP/startup-tools" -OutputDirectory "$env:RUNNER_TEMP/startup-evidence" -ApplicationPath $env:STARTUP_EXE -StartupDiagnostic -StartupManifest $env:STARTUP_MANIFEST -StartupSource $env:STARTUP_SOURCE -WryDiagnostic
      - name: Validate test-only Wry callbacks and provenance
        if: always()
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/startup-evidence" -Force | Out-Null
          node ui/tauri/native-smoke/inspect-wry-startup.ts --directory "$env:RUNNER_TEMP/startup-tools/app-startup" --provenance "$env:RUNNER_TEMP/wry-provenance.json" --exe $env:STARTUP_EXE --source $env:STARTUP_SOURCE --collection "$env:RUNNER_TEMP/startup-evidence/native-result.json" > "$env:RUNNER_TEMP/startup-evidence/wry-startup-report.json"
          exit $LASTEXITCODE
      - name: Validate anonymous app stage and build after cleanup
        if: always()
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/startup-evidence" -Force | Out-Null
          node ui/tauri/native-smoke/inspect-app-startup.ts --directory "$env:RUNNER_TEMP/startup-tools/app-startup" --manifest $env:STARTUP_MANIFEST --exe $env:STARTUP_EXE --source $env:STARTUP_SOURCE --collection "$env:RUNNER_TEMP/startup-evidence/native-result.json" > "$env:RUNNER_TEMP/startup-evidence/app-startup-report.json"
          exit $LASTEXITCODE
      - name: Validate anonymous driver stage and provenance
        if: always()
        timeout-minutes: 1
        run: ./ui/tauri/native-smoke/inspect-driver-trace.ps1 -ToolsDirectory "$env:RUNNER_TEMP/startup-tools" -OutputDirectory "$env:RUNNER_TEMP/startup-evidence"
      - name: Save safe evidence only, never the diagnostic EXE or ZIP
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: startup-diagnostic-${{ matrix.profile }}-evidence
          path: |
            ${{ runner.temp }}/startup-evidence/*.json
            ${{ runner.temp }}/startup-inventory.json
            ${{ runner.temp }}/win32-pump-contract.json
          if-no-files-found: error
          retention-days: 7
  direct-wry-contrast:
    # 既存2profileの合否を保持し、その後の別runnerで1回だけ実行する。
    needs: startup-diagnostic
    if: always()
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Verify baseline generation and decision contracts
        run: |
          python -I -m unittest discover -s scripts/tests -p test_wry_baseline.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location ui/tauri
          try { node --test tests/wry-baseline.test.ts tests/wry-baseline-cli.test.ts tests/wry-startup-files.test.ts; $code = $LASTEXITCODE } finally { Pop-Location }
          exit $code
      - name: Record fixed source and existing runtime only
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw 'NATIVE_DIAGNOSTIC_SOURCE_INVALID' }
          "STARTUP_SOURCE=$sha" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/baseline-target" >> $env:GITHUB_ENV
          ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:RUNNER_TEMP/baseline-inventory.json"
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          exit $LASTEXITCODE
      - name: Prepare same pinned Wry source and isolated baseline graph
        run: |
          Invoke-WebRequest 'https://static.crates.io/crates/wry/wry-0.57.1.crate' -OutFile "$env:RUNNER_TEMP/wry.crate" -TimeoutSec 60
          Invoke-WebRequest 'https://static.crates.io/crates/webview2-com/webview2-com-0.39.1.crate' -OutFile "$env:RUNNER_TEMP/pump.crate" -TimeoutSec 60
          Invoke-WebRequest 'https://static.crates.io/crates/webview2-com-macros/webview2-com-macros-0.8.1.crate' -OutFile "$env:RUNNER_TEMP/macro.crate" -TimeoutSec 60
          python scripts/apply_wry_trace.py --archive "$env:RUNNER_TEMP/wry.crate" --pump-archive "$env:RUNNER_TEMP/pump.crate" --macro-archive "$env:RUNNER_TEMP/macro.crate" --bundle tools/wry-startup-trace --source "$env:RUNNER_TEMP/wry-source" --app-lock ui/tauri/src-tauri/Cargo.lock --report "$env:RUNNER_TEMP/wry-prepared.json" --source-commit $env:STARTUP_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_wry_baseline.py --manifest ui/tauri/src-tauri/Cargo.toml --lock ui/tauri/src-tauri/Cargo.lock --fixture tools/wry-creation-baseline/main.rs --output "$env:RUNNER_TEMP/baseline-project" --report "$env:RUNNER_TEMP/baseline-provenance.json" --source-commit $env:STARTUP_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourcePath = "$env:RUNNER_TEMP/wry-source".Replace('\', '/')
          "STARTUP_WRY_CONFIG=patch.crates-io.wry.path='$sourcePath'" >> $env:GITHUB_ENV
      - name: Compare existing Wry and Tao feature graph then build release contrast
        timeout-minutes: 12
        run: |
          $common = @('+1.99.1', 'metadata', '--locked', '--format-version', '1', '--config', $env:STARTUP_WRY_CONFIG, '--filter-platform', 'x86_64-pc-windows-msvc', '--features', 'custom-protocol,startup-diagnostics')
          $appText = & cargo @common --manifest-path ui/tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baselineText = & cargo @common --manifest-path "$env:RUNNER_TEMP/baseline-project/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = ($appText -join "`n") | ConvertFrom-Json -Depth 100
          $baseline = ($baselineText -join "`n") | ConvertFrom-Json -Depth 100
          $features = [ordered]@{}
          foreach ($crate in @('wry', 'tao')) {
            $left = @($app.packages | Where-Object name -eq $crate)
            $right = @($baseline.packages | Where-Object name -eq $crate)
            if ($left.Count -ne 1 -or $right.Count -ne 1 -or $left[0].version -cne $right[0].version) { throw 'NATIVE_BASELINE_FEATURE_GRAPH_DRIFT' }
            $leftNode = @($app.resolve.nodes | Where-Object id -eq $left[0].id)
            $rightNode = @($baseline.resolve.nodes | Where-Object id -eq $right[0].id)
            if ($leftNode.Count -ne 1 -or $rightNode.Count -ne 1 -or (($leftNode[0].features | Sort-Object) -join ',') -cne (($rightNode[0].features | Sort-Object) -join ',')) { throw 'NATIVE_BASELINE_FEATURE_GRAPH_DRIFT' }
            $features[$crate] = @($leftNode[0].features | Sort-Object)
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/baseline-feature-check.json", ([ordered]@{ schema = 1; matched = $true; features = $features; manifestParity = 'not-proven' } | ConvertTo-Json -Depth 6 -Compress))
          cargo +1.99.1 build --locked --release --config $env:STARTUP_WRY_CONFIG --manifest-path "$env:RUNNER_TEMP/baseline-project/Cargo.toml" --features custom-protocol,startup-diagnostics --bin rescue-wry-creation-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 test --locked --release --config $env:STARTUP_WRY_CONFIG --manifest-path "$env:RUNNER_TEMP/baseline-project/Cargo.toml" --features custom-protocol,startup-diagnostics --bin rescue-wry-creation-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_wry_baseline.py --verify --manifest ui/tauri/src-tauri/Cargo.toml --lock ui/tauri/src-tauri/Cargo.lock --fixture tools/wry-creation-baseline/main.rs --output "$env:RUNNER_TEMP/baseline-project" --report "$env:RUNNER_TEMP/baseline-provenance.json" --source-commit $env:STARTUP_SOURCE
          exit $LASTEXITCODE
      - name: Bind source and binary to diagnostic-only build
        run: |
          $exe = "$env:CARGO_TARGET_DIR/release/rescue-wry-creation-baseline.exe"
          python scripts/apply_wry_trace.py --verify --archive "$env:RUNNER_TEMP/wry.crate" --pump-archive "$env:RUNNER_TEMP/pump.crate" --macro-archive "$env:RUNNER_TEMP/macro.crate" --bundle tools/wry-startup-trace --source "$env:RUNNER_TEMP/wry-source" --app-lock ui/tauri/src-tauri/Cargo.lock --report "$env:RUNNER_TEMP/wry-provenance.json" --source-commit $env:STARTUP_SOURCE --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = [ordered]@{ schema = 1; kind = 'direct-wry-controller-contrast'; sourceCommit = $env:STARTUP_SOURCE; exeSha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant(); featureTreeMatched = $true; distribution = $false }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/baseline-build.json", ($build | ConvertTo-Json -Compress))
      - name: Prepare existing verified driver path
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:RUNNER_TEMP/baseline-tools" -InventoryPath "$env:RUNNER_TEMP/baseline-inventory.json"
      - name: One 15 second session and owned normal close
        timeout-minutes: 3
        run: ./tools/wry-creation-baseline/supervise.ps1 -ToolsDirectory "$env:RUNNER_TEMP/baseline-tools" -OutputDirectory "$env:RUNNER_TEMP/baseline-evidence" -ApplicationPath "$env:CARGO_TARGET_DIR/release/rescue-wry-creation-baseline.exe" -BuildManifest "$env:RUNNER_TEMP/baseline-build.json"
      - name: Validate Wry stage and independent contrast decision
        if: always()
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/baseline-evidence" -Force | Out-Null
          $exe = "$env:CARGO_TARGET_DIR/release/rescue-wry-creation-baseline.exe"
          node ui/tauri/native-smoke/inspect-wry-startup.ts --directory "$env:RUNNER_TEMP/baseline-tools/baseline-trace" --provenance "$env:RUNNER_TEMP/wry-provenance.json" --exe $exe --source $env:STARTUP_SOURCE --collection "$env:RUNNER_TEMP/baseline-evidence/native-result.json" > "$env:RUNNER_TEMP/baseline-evidence/wry-startup-report.json"
          $wryCode = $LASTEXITCODE
          node ui/tauri/native-smoke/inspect-wry-baseline.ts --directory "$env:RUNNER_TEMP/baseline-evidence" --source $env:STARTUP_SOURCE --exe $exe --build "$env:RUNNER_TEMP/baseline-build.json" > "$env:RUNNER_TEMP/baseline-evidence/contrast-decision.json"
          if ($wryCode -ne 0) { exit $wryCode }
          exit $LASTEXITCODE
      - name: Validate anonymous contrast driver trace
        if: always()
        timeout-minutes: 1
        run: ./ui/tauri/native-smoke/inspect-driver-trace.ps1 -ToolsDirectory "$env:RUNNER_TEMP/baseline-tools" -OutputDirectory "$env:RUNNER_TEMP/baseline-evidence"
      - name: Save safe contrast evidence without EXE or profile
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: direct-wry-contrast-evidence
          path: |
            ${{ runner.temp }}/baseline-evidence/*.json
            ${{ runner.temp }}/baseline-build.json
            ${{ runner.temp }}/baseline-feature-check.json
            ${{ runner.temp }}/baseline-provenance.json
            ${{ runner.temp }}/baseline-inventory.json
          if-no-files-found: error
          retention-days: 7
