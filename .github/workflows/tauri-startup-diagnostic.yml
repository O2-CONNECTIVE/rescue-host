name: Bounded trace activation experiment
on:
  pull_request:
    branches: ['wip/windows-wry-startup-diagnostic-20261103']
    types: [opened]
    paths: ['.github/workflows/tauri-startup-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: trace-activation-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  startup-diagnostic:
    if: >-
      ${{ github.event_name == 'pull_request' &&
           github.event.action == 'opened' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref == 'wip/windows-trace-activation-observation-20261103' &&
           github.event.pull_request.base.sha == 'deb3c8443c5013eb045eec4aa1836f274bb44468' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: [release]
        trace: [enabled, disabled]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: deb3c8443c5013eb045eec4aa1836f274bb44468
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Test isolated Wry source and lock preparation
        run: python -m unittest discover -s scripts/tests -p test_prepare_wry_trace.py
      - name: Test fixed classification and file boundary
        working-directory: ui/tauri
        run: node --test tests/app-startup-stages.test.ts tests/app-startup-files.test.ts tests/app-startup-cli.test.ts
      - name: Test finite harness collection contract
        run: ./ui/tauri/native-smoke/app-startup-contract.test.ps1
      - name: Record exact diagnostic source and existing runtime
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw 'NATIVE_DIAGNOSTIC_SOURCE_INVALID' }
          "STARTUP_SOURCE=$sha" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/startup-target" >> $env:GITHUB_ENV
          ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:RUNNER_TEMP/startup-inventory.json"
      - name: Select existing fixed CI Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Prepare pinned driver diagnostic source
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:RUNNER_TEMP/startup-tools" -InventoryPath "$env:RUNNER_TEMP/startup-inventory.json"
      - name: Build unchanged bundled frontend
        working-directory: ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Prepare hash-pinned Wry only in the isolated diagnostic copy
        run: |
          $archive = "$env:RUNNER_TEMP/wry-0.57.1.crate"
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/wry/wry-0.57.1.crate' -OutFile $archive
          python scripts/prepare_wry_trace.py --source-root "$env:GITHUB_WORKSPACE" --archive $archive --output "$env:RUNNER_TEMP/wry-startup-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WRY_MANIFEST=$env:RUNNER_TEMP/wry-startup-source/app/src-tauri/Cargo.toml" >> $env:GITHUB_ENV
      - name: Test and build explicit diagnostic feature
        working-directory: ui/tauri
        env:
          STARTUP_PROFILE: ${{ matrix.profile }}
        run: |
          cargo +1.99.1 metadata --locked --format-version 1 --manifest-path $env:WRY_MANIFEST > "$env:RUNNER_TEMP/wry-cargo-metadata.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../../scripts/prepare_wry_trace.py --output "$env:RUNNER_TEMP/wry-startup-source" --verify-output --metadata "$env:RUNNER_TEMP/wry-cargo-metadata.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 test --locked --manifest-path $env:WRY_MANIFEST --features custom-protocol,startup-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $args = @('+1.99.1', 'build', '--locked', '--manifest-path', $env:WRY_MANIFEST, '--features', 'custom-protocol,startup-diagnostics')
          if ($env:STARTUP_PROFILE -eq 'release') { $args += '--release' }
          & cargo @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../../scripts/prepare_wry_trace.py --output "$env:RUNNER_TEMP/wry-startup-source" --verify-output --metadata "$env:RUNNER_TEMP/wry-cargo-metadata.json"
          exit $LASTEXITCODE
      - name: Bind source features and hash to isolated diagnostic fixture
        env:
          STARTUP_PROFILE: ${{ matrix.profile }}
        run: |
          $fixture = "$env:RUNNER_TEMP/startup-fixture"
          New-Item -ItemType Directory $fixture -ErrorAction Stop | Out-Null
          $exe = "$env:CARGO_TARGET_DIR/$env:STARTUP_PROFILE/rescue-host-shell.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1; variant = 'host-wry-startup-diagnostic-1'; sourceCommit = $env:STARTUP_SOURCE
            features = @('custom-protocol', 'startup-diagnostics'); profile = $env:STARTUP_PROFILE
            exeSha256 = $hash; distribution = $false
            wryTrace = Get-Content "$env:RUNNER_TEMP/wry-startup-source/provenance.json" -Raw | ConvertFrom-Json
          }
          Copy-Item -LiteralPath $exe -Destination "$fixture/rescue-host-shell.exe"
          [IO.File]::WriteAllText("$fixture/BUILD.json", ($manifest | ConvertTo-Json -Depth 4 -Compress))
          if ($env:STARTUP_PROFILE -eq 'release') {
            # 通常配布packageとは別の、runner内だけの診断ZIP。
            Compress-Archive -Path "$fixture/*" -DestinationPath "$env:RUNNER_TEMP/startup-diagnostic-fixture.zip"
            Expand-Archive "$env:RUNNER_TEMP/startup-diagnostic-fixture.zip" -DestinationPath "$env:RUNNER_TEMP/startup-unpacked"
            $fixture = "$env:RUNNER_TEMP/startup-unpacked"
          }
          "STARTUP_EXE=$fixture/rescue-host-shell.exe" >> $env:GITHUB_ENV
          "STARTUP_MANIFEST=$fixture/BUILD.json" >> $env:GITHUB_ENV
          node ui/tauri/native-smoke/inspect-app-startup.ts --manifest "$fixture/BUILD.json" --exe "$fixture/rescue-host-shell.exe" --source $env:STARTUP_SOURCE --build-only
          exit $LASTEXITCODE
      - name: One native request with existing owned cleanup
        timeout-minutes: 3
        env:
          EXPERIMENT_TRACE: ${{ matrix.trace }}
          EXPERIMENT_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $mode = $env:EXPERIMENT_TRACE
          if ($mode -notin @('enabled', 'disabled')) { throw 'EXPERIMENT_MODE_REJECTED' }
          $record = [ordered]@{
            experiment = 'same-source-trace-activation-1'; mode = $mode
            workflowCommit = $env:EXPERIMENT_WORKFLOW_HEAD
            sourceCommit = $env:STARTUP_SOURCE
            exeSha256 = (Get-FileHash $env:STARTUP_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
            purpose = 'diagnostic-comparison-not-production-verdict'
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/trace-activation.json", ($record | ConvertTo-Json -Compress))
          $parameters = @{
            ToolsDirectory = "$env:RUNNER_TEMP/startup-tools"
            OutputDirectory = "$env:RUNNER_TEMP/startup-evidence"
            ApplicationPath = $env:STARTUP_EXE
          }
          if ($mode -eq 'enabled') {
            $parameters.StartupDiagnostic = $true
            $parameters.StartupManifest = $env:STARTUP_MANIFEST
            $parameters.StartupSource = $env:STARTUP_SOURCE
          }
          & ./ui/tauri/native-smoke/supervise.ps1 @parameters
          exit $LASTEXITCODE
      - name: Validate anonymous app stage and build after cleanup
        if: always() && matrix.trace == 'enabled'
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/startup-evidence" -Force | Out-Null
          node ui/tauri/native-smoke/inspect-app-startup.ts --directory "$env:RUNNER_TEMP/startup-tools/app-startup" --manifest $env:STARTUP_MANIFEST --exe $env:STARTUP_EXE --source $env:STARTUP_SOURCE --collection "$env:RUNNER_TEMP/startup-evidence/native-result.json" > "$env:RUNNER_TEMP/startup-evidence/app-startup-report.json"
          exit $LASTEXITCODE
      - name: Validate anonymous driver stage and provenance
        if: always()
        timeout-minutes: 1
        run: ./ui/tauri/native-smoke/inspect-driver-trace.ps1 -ToolsDirectory "$env:RUNNER_TEMP/startup-tools" -OutputDirectory "$env:RUNNER_TEMP/startup-evidence"
      - name: Save safe evidence only, never the diagnostic EXE or ZIP
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trace-activation-${{ matrix.trace }}-${{ matrix.profile }}-evidence
          path: |
            ${{ runner.temp }}/startup-evidence/*.json
            ${{ runner.temp }}/startup-inventory.json
            ${{ runner.temp }}/trace-activation.json
            ${{ runner.temp }}/startup-fixture/BUILD.json
            ${{ runner.temp }}/wry-startup-source/provenance.json
          if-no-files-found: error
          retention-days: 7
