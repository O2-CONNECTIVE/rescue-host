name: Fixed main session timeout reproduction
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/main-timeout-repro.yml', 'scripts/tests/test_main_timeout_repro.py']
permissions:
  contents: read
jobs:
  fixed-main-reproduction:
    runs-on: windows-2022
    # 元の35分予算に、最大15分の3試行と証跡回収の余白を加える。
    timeout-minutes: 55
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Test reproduction contract
        working-directory: control
        run: python -I -m unittest discover -s scripts/tests -p test_main_timeout_repro.py -v
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 1eda7a4e964d34a751dcc89509ee07b3482917a7
          path: source
          persist-credentials: false
      - name: Create owned temporary root
        run: |
          $id = [Guid]::NewGuid().ToString('D').ToLowerInvariant()
          $root = Join-Path $env:RUNNER_TEMP ("main-repro-" + $id)
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          [IO.File]::WriteAllText((Join-Path $root 'owner.json'), ([ordered]@{schema=1; purpose='main-repro'; runId=$id} | ConvertTo-Json -Compress))
          "REPRO_ROOT=$root" >> $env:GITHUB_ENV
          "REPRO_RUN_ID=$id" >> $env:GITHUB_ENV
          $initial = [ordered]@{schema=1; trials=@(1..3 | ForEach-Object { [ordered]@{trial=$_; outcome='not-started'; sessionOutcome='not-started'; sessionMs=$null; normalClose=$null; driverTrace='not-started'; cleanup='not-started'} })}
          [IO.File]::WriteAllText((Join-Path $root 'three-trials.json'), ($initial | ConvertTo-Json -Depth 6 -Compress))
      - name: Record fixed source and test archive boundary
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cne '1eda7a4e964d34a751dcc89509ee07b3482917a7') { throw 'SOURCE_SHA_MISMATCH' }
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'SOURCE_SHA_INVALID' }
          "EVALUATION_SOURCE_SHA=$sha" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:REPRO_ROOT/tauri-evaluation-target" >> $env:GITHUB_ENV
          python -B -m unittest discover -s scripts/tests -p 'test_tauri_evaluation_*.py' -v
          exit $LASTEXITCODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Build locked frontend with runtime notices
        working-directory: source/ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/notices.mjs --check
          exit $LASTEXITCODE
      - name: Select fixed official Rust in disposable CI
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Read locked Cargo metadata before compiling
        working-directory: source/ui/tauri
        run: |
          cargo +1.99.1 metadata --locked --format-version 1 --features custom-protocol --filter-platform x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml > "$env:REPRO_ROOT/cargo-metadata.json"
          exit $LASTEXITCODE
      - name: Collect complete dependency license texts before compiling
        run: |
          $sysroot = (rustc +1.99.1 --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath "$sysroot/share/doc/rust" -File | Select-Object -ExpandProperty Name
          python -B scripts/collect_tauri_licenses.py --metadata "$env:REPRO_ROOT/cargo-metadata.json" --frontend-notice ui/tauri/dist/THIRD_PARTY_NOTICES.txt --rust-docs "$sysroot/share/doc/rust" --output "$env:REPRO_ROOT/evaluation-licenses"
          exit $LASTEXITCODE
      - name: Build locked release executable
        working-directory: source/ui/tauri
        run: cargo +1.99.1 build --release --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Create source-bound evaluation archive
        run: |
          $exe = "$env:CARGO_TARGET_DIR/release/rescue-host-shell.exe"
          if ((Get-AuthenticodeSignature $exe).Status -ne 'NotSigned') { throw 'UNEXPECTED_SIGNATURE_STATE' }
          python -B scripts/package_tauri_evaluation.py --exe $exe --licenses "$env:REPRO_ROOT/evaluation-licenses" --source-sha $env:EVALUATION_SOURCE_SHA --output "$env:REPRO_ROOT/evaluation-package"
          exit $LASTEXITCODE
      - name: Extract the exact distribution ZIP and check every file hash
        run: |
          $zip = "$env:REPRO_ROOT/evaluation-package/RescueHostTauriUnwiredEvaluation-x64.zip"
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "$env:CARGO_TARGET_DIR/release/rescue-host-shell.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B scripts/verify_tauri_evaluation.py --archive $zip --source $env:EVALUATION_SOURCE_SHA --archive-sha256 $zipHash --exe-sha256 $exeHash > "$env:REPRO_ROOT/evaluation-package/verification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive $zip -DestinationPath "$env:REPRO_ROOT/evaluation-unpacked"
          $root = "$env:REPRO_ROOT/evaluation-unpacked/RescueHostTauriUnwiredEvaluation"
          $manifest = Get-Content "$root/MANIFEST.json" -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:EVALUATION_SOURCE_SHA -or $manifest.integration -ne 'not_connected' -or $manifest.canStart -or $manifest.canStop -or -not $manifest.productionGateClosed) { throw 'PACKAGE_BOUNDARY_MISMATCH' }
          foreach ($file in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash (Join-Path $root $file.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value) { throw 'PACKAGE_FILE_HASH_MISMATCH' }
          }
      - name: Read existing CI WebView2 without updating it
        run: ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:REPRO_ROOT/evaluation-inventory.json"
      - name: Prepare existing pinned native test tools in runner temp
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:REPRO_ROOT/evaluation-tools" -InventoryPath "$env:REPRO_ROOT/evaluation-inventory.json"
      - name: Three fixed isolated sessions with ownership checks
        # 各 trial 最大 180秒 + 検証 60秒の 3 回に、コピーと結果保存の余白を加える。
        timeout-minutes: 15
        run: |
          $root = $env:REPRO_ROOT
          $exe = Join-Path $root 'evaluation-unpacked/RescueHostTauriUnwiredEvaluation/rescue-host-shell.exe'
          $template = Join-Path $root 'evaluation-tools'
          $summaryPath = Join-Path $root 'three-trials.json'
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          function Save-Trials($Value) {
            $temp = $summaryPath + '.tmp-' + [Guid]::NewGuid().ToString('D')
            try {
              [IO.File]::WriteAllText($temp, ($Value | ConvertTo-Json -Depth 8 -Compress))
              [IO.File]::Replace($temp, $summaryPath, $null)
            } finally { if (Test-Path -LiteralPath $temp) { Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue } }
          }
          $summary | Add-Member -NotePropertyName exeSha256 -NotePropertyValue (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary | Add-Member -NotePropertyName tauriSha256 -NotePropertyValue (Get-FileHash -LiteralPath "$template/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary | Add-Member -NotePropertyName edgeSha256 -NotePropertyValue (Get-FileHash -LiteralPath "$template/edge/msedgedriver.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($name in @('webview-profile', 'driver-stage.jsonl', 'driver.stdout.log', 'driver.stderr.log', 'test.stdout.log', 'test.stderr.log')) {
            if (Test-Path -LiteralPath (Join-Path $template $name)) { throw 'TEMPLATE_NOT_CLEAN' }
          }
          Save-Trials $summary
          $allPassed = $true
          function Invoke-OwnedPwsh([string[]]$Arguments, [int]$LimitMs) {
            $process = [Diagnostics.Process]::new()
            $process.StartInfo.FileName = (Get-Command pwsh).Source
            $process.StartInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) { [void]$process.StartInfo.ArgumentList.Add($argument) }
            if (-not $process.Start()) { throw 'OWNED_PROCESS_START_FAILED' }
            if (-not $process.WaitForExit($LimitMs)) {
              try { $process.Kill(); [void]$process.WaitForExit(2000) } catch { }
              throw 'OWNED_PROCESS_TIMEOUT'
            }
            return $process.ExitCode
          }
          foreach ($trial in 1..3) {
            $row = $summary.trials[$trial - 1]
            $tools = Join-Path $root "evaluation-trial-$trial-tools"
            $out = Join-Path $root "evaluation-trial-$trial-evidence"
            $row.outcome = 'started'
            $row.sessionOutcome = 'unknown'
            $row.driverTrace = 'unknown'
            $row.cleanup = 'unconfirmed'
            Save-Trials $summary
            try {
              $version = (Get-Content ./ui/tauri/native-smoke/tools.json -Raw | ConvertFrom-Json).tauriDriverVersion
              if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'TRIAL_TOOL_VERSION_INVALID' }
              New-Item -ItemType Directory -Path "$tools/edge", "$tools/tauri/bin" -Force -ErrorAction Stop | Out-Null
              Copy-Item -LiteralPath "$template/edge/msedgedriver.exe" -Destination "$tools/edge/msedgedriver.exe" -ErrorAction Stop
              Copy-Item -LiteralPath "$template/tauri/bin/tauri-driver.exe" -Destination "$tools/tauri/bin/tauri-driver.exe" -ErrorAction Stop
              Copy-Item -LiteralPath "$template/driver-provenance.json", "$template/tauri-driver.crate" -Destination $tools -ErrorAction Stop
              Copy-Item -LiteralPath "$template/tauri-driver-$version" -Destination "$tools/tauri-driver-$version" -Recurse -ErrorAction Stop
              if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.exeSha256 -or
                  (Get-FileHash -LiteralPath "$tools/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.tauriSha256 -or
                  (Get-FileHash -LiteralPath "$tools/edge/msedgedriver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.edgeSha256) { throw 'TRIAL_BINARY_MISMATCH' }
              $exit = Invoke-OwnedPwsh @('-NoProfile', '-NonInteractive', '-File', './ui/tauri/native-smoke/supervise.ps1', '-ToolsDirectory', $tools, '-OutputDirectory', $out, '-ApplicationPath', $exe) 180000
              $report = Get-Content -LiteralPath (Join-Path $out 'native-result.json') -Raw | ConvertFrom-Json
              $timing = Get-Content -LiteralPath (Join-Path $out 'session-startup-timing.json') -Raw | ConvertFrom-Json
              $row.sessionMs = $timing.settledMs
              if ($timing.outcome -in @('success', 'timeout', 'transport', 'other')) { $row.sessionOutcome = $timing.outcome }
              if ($report.normalCloseVerified -is [bool]) { $row.normalClose = $report.normalCloseVerified }
              $row.outcome = if ($exit -eq 0 -and $report.nativeTestsPassed -eq 1 -and $timing.outcome -eq 'success') { 'success' } else { 'failed' }
              $inspectExit = Invoke-OwnedPwsh @('-NoProfile', '-NonInteractive', '-File', './ui/tauri/native-smoke/inspect-driver-trace.ps1', '-ToolsDirectory', $tools, '-OutputDirectory', $out) 60000
              $row.driverTrace = if ($inspectExit -eq 0) { 'pass' } else { 'fail' }
              if ($inspectExit -ne 0) { $allPassed = $false }
              if ($report.nativeTestsRun -ne 1 -or $report.nativeTestsPassed -ne 1 -or $report.normalCloseVerified -ne $true -or $report.cleanupFailures -ne 0 -or $report.driverExitObservedAfterCleanup -ne $true) { throw 'TRIAL_CLEANUP_UNCONFIRMED' }
              if (@(Get-NetTCPConnection -State Listen -ErrorAction Stop | Where-Object LocalPort -in @(4444, 4445)).Count -ne 0) { throw 'TRIAL_CLEANUP_UNCONFIRMED' }
              $driverPaths = @((Join-Path $tools 'tauri/bin/tauri-driver.exe'), (Join-Path $tools 'edge/msedgedriver.exe'))
              foreach ($candidate in @(Get-CimInstance Win32_Process -Filter "Name = 'msedgedriver.exe' OR Name = 'tauri-driver.exe'" -ErrorAction Stop)) {
                if (-not $candidate.ExecutablePath -or $candidate.ExecutablePath -in $driverPaths) { throw 'TRIAL_CLEANUP_UNCONFIRMED' }
              }
              if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.exeSha256 -or
                  (Get-FileHash -LiteralPath "$tools/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.tauriSha256 -or
                  (Get-FileHash -LiteralPath "$tools/edge/msedgedriver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.edgeSha256) { throw 'TRIAL_BINARY_MISMATCH' }
              $row.cleanup = 'confirmed'
              if ($row.outcome -ne 'success') { $allPassed = $false }
            } catch {
              if ($row.outcome -eq 'started') { $row.outcome = 'failed' }
              $allPassed = $false
              Write-Output 'TRIAL_CLEANUP_UNCONFIRMED'
            } finally {
              Save-Trials $summary
            }
            if ($row.cleanup -ne 'confirmed') { break }
          }
          if (-not $allPassed -or @($summary.trials | Where-Object outcome -eq 'success').Count -ne 3) { exit 1 }
      - name: Save anonymous failure or success evidence
        id: save_evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fixed-main-reproduction-evidence
          path: |
            ${{ env.REPRO_ROOT }}/three-trials.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/native-observation.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/native-result.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/session-startup-timing.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/driver-provenance.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/driver-stage-report.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/webview-result.json
            ${{ env.REPRO_ROOT }}/evaluation-inventory.json
            ${{ env.REPRO_ROOT }}/evaluation-package/verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove only proven owned root
        if: ${{ always() && steps.save_evidence.outcome == 'success' }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP ("main-repro-cleanup-" + $env:REPRO_RUN_ID + ".json")
          $state = 'unconfirmed'
          try {
            $id = $env:REPRO_RUN_ID
            if ($id -cnotmatch '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') { throw 'OWNER_INVALID' }
            $expected = Join-Path $env:RUNNER_TEMP ("main-repro-" + $id)
            if ($env:REPRO_ROOT -cne $expected) { throw 'OWNER_INVALID' }
            $item = Get-Item -LiteralPath $expected -Force -ErrorAction Stop
            if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'OWNER_INVALID' }
            $owner = Get-Content -LiteralPath (Join-Path $expected 'owner.json') -Raw | ConvertFrom-Json
            if ($owner.schema -ne 1 -or $owner.purpose -cne 'main-repro' -or $owner.runId -cne $id) { throw 'OWNER_INVALID' }
            $summary = Get-Content -LiteralPath (Join-Path $expected 'three-trials.json') -Raw | ConvertFrom-Json
            if ($summary.schema -ne 1 -or @($summary.trials).Count -ne 3 -or @($summary.trials | Where-Object cleanup -eq 'confirmed').Count -eq 0) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
            $notStartedSeen = $false
            foreach ($i in 0..2) {
              $row = $summary.trials[$i]
              if ($row.trial -ne ($i + 1) -or $row.cleanup -cnotin @('confirmed', 'not-started')) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
              if ($row.cleanup -ceq 'not-started') {
                $notStartedSeen = $true
                if ($row.outcome -cne 'not-started' -or $row.sessionOutcome -cne 'not-started' -or $row.driverTrace -cne 'not-started') { throw 'OWNER_CLEANUP_UNCONFIRMED' }
              }
              if ($row.cleanup -ceq 'confirmed' -and $notStartedSeen) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
              if ($row.cleanup -ceq 'confirmed' -and $row.outcome -cnotin @('success', 'failed')) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
            }
            if (@(Get-NetTCPConnection -State Listen -ErrorAction Stop | Where-Object LocalPort -in @(4444, 4445)).Count -ne 0) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
            foreach ($candidate in @(Get-CimInstance Win32_Process -Filter "Name = 'msedgedriver.exe' OR Name = 'tauri-driver.exe'" -ErrorAction Stop)) {
              if (-not $candidate.ExecutablePath -or $candidate.ExecutablePath.StartsWith($expected + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
            }
            Remove-Item -LiteralPath $expected -Recurse -Force -ErrorAction Stop
            if (Test-Path -LiteralPath $expected) { throw 'OWNER_CLEANUP_UNCONFIRMED' }
            $state = 'removed'
          } catch { Write-Output 'OWNER_CLEANUP_UNCONFIRMED' }
          [IO.File]::WriteAllText($out, ([ordered]@{schema=1; cleanup=$state} | ConvertTo-Json -Compress))
          if ($state -ne 'removed') { exit 1 }
      - name: Save owned cleanup result
        if: ${{ always() && steps.save_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fixed-main-reproduction-cleanup
          path: ${{ runner.temp }}/main-repro-cleanup-${{ env.REPRO_RUN_ID }}.json
          if-no-files-found: error
          retention-days: 7
