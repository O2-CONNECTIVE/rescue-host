name: Bounded lineage baseline observation
on:
  pull_request:
    branches: ['wip/tauri-mac-app-output-public-20261103']
    types: [opened]
    paths: ['.github/workflows/tauri-native-smoke.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-smoke:
    if: >-
      ${{ github.event_name == 'pull_request' &&
           github.event.action == 'opened' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref == 'wip/windows-lineage-baseline-observation-20261103' &&
           github.event.pull_request.base.sha == '33bb93cfbc0592c721410fa9821c5bf642697351' }}
    name: Windows WebView2 launch, IPC and normal close
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test ownership and close rejection contract
        run: |
          ./ui/tauri/native-smoke/process-contract.test.ps1
          ./ui/tauri/native-smoke/lineage-baseline.test.ps1
      - name: Read existing WebView2 and driver versions
        shell: pwsh
        run: ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:RUNNER_TEMP/native-inventory.json"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Select existing approved CI Rust version
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Prepare hash-pinned test tools in runner temp
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:RUNNER_TEMP/native-tools" -InventoryPath "$env:RUNNER_TEMP/native-inventory.json"
      - name: Build locked frontend
        working-directory: ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ui/tauri/src-tauri/target
          key: tauri-windows-rust-1.99.1-${{ hashFiles('ui/tauri/src-tauri/Cargo.lock', 'ui/tauri/src-tauri/Cargo.toml') }}
          restore-keys: tauri-windows-rust-1.99.1-
      - name: Build unchanged native shell
        working-directory: ui/tauri
        run: cargo +1.99.1 build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Bind this bounded observation to exact source and EXE
        env:
          EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cne $env:EXPERIMENT_HEAD) { throw 'LINEAGE_EXPERIMENT_SOURCE_DRIFT' }
          $exe = 'ui/tauri/src-tauri/target/debug/rescue-host-shell.exe'
          $record = [ordered]@{
            schema = 1; experiment = 'lineage-before-driver-observation-1'
            sourceCommit = $sha; baseCommit = '33bb93cfbc0592c721410fa9821c5bf642697351'
            exeSha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            plannedNativeInvocations = 1; purpose = 'diagnostic-observation-not-fix'
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/lineage-experiment.json", ($record | ConvertTo-Json -Compress))
      - name: One native smoke with bounded owned-process cleanup
        timeout-minutes: 3
        run: ./ui/tauri/native-smoke/supervise.ps1 -ToolsDirectory "$env:RUNNER_TEMP/native-tools" -OutputDirectory "$env:RUNNER_TEMP/native-evidence"
      - name: Validate anonymous driver stages and provenance
        if: always()
        timeout-minutes: 1
        run: ./ui/tauri/native-smoke/inspect-driver-trace.ps1 -ToolsDirectory "$env:RUNNER_TEMP/native-tools" -OutputDirectory "$env:RUNNER_TEMP/native-evidence"
      - name: Save sanitized native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lineage-before-driver-evidence
          path: |
            ${{ runner.temp }}/native-inventory.json
            ${{ runner.temp }}/lineage-experiment.json
            ${{ runner.temp }}/native-evidence/*.json
          if-no-files-found: error
          retention-days: 7
