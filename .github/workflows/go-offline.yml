name: Go offline foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, wip/tether-public-pilot-20261101]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      GOFLAGS: ''
    steps:
      - name: Check out public source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require and record exact source checkout
        working-directory: ${{ github.workspace }}
        run: python scripts/check_ci_checkout.py
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
      - name: Set up fixed Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: x64
          cache: false
      - name: Prepare and verify public modules
        id: prepare
        run: python scripts/go_ci.py prepare
      - name: Vet and check production source boundary
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python scripts/go_ci.py build
      - name: Normal tests on one CPU
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python scripts/go_ci.py test
      - name: Race tests on two CPUs
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python scripts/go_ci.py race
      # Go ./... intentionally excludes testdata; this peer has no runtime backend.
      - name: Test tokenless MCP schema fixture
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: python scripts/check_tether_fixtures.py go-schema
