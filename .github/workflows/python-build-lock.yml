name: Python Windows build lock

on:
  pull_request:
    branches: [main]
    paths: ['requirements-build.txt', 'build-python-lock.json', 'build_windows.ps1', 'scripts/check_build_lock.py', 'scripts/tests/test_build_lock.py', '.github/workflows/python-build-lock.yml']
  push:
    branches: [main]
    paths: ['requirements-build.txt', 'build-python-lock.json', 'build_windows.ps1', 'scripts/check_build_lock.py', 'scripts/tests/test_build_lock.py', '.github/workflows/python-build-lock.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-lock:
    name: Windows wheel lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Validate exact pins
        run: python scripts/check_build_lock.py
      - name: Validate finite rejection fixtures
        run: python -m unittest discover -s scripts/tests -p test_build_lock.py -v
      - name: Download Windows wheels with mandatory hashes
        run: >-
          python -m pip --isolated --disable-pip-version-check download --index-url https://pypi.org/simple
          --no-cache-dir --require-hashes --only-binary=:all: --no-deps --platform win_amd64
          --python-version 3.13 --implementation cp --abi cp313 --dest .work/build-wheels -r requirements-build.txt
      - name: Verify wheel bytes metadata and license inventory
        run: python scripts/check_build_lock.py --wheelhouse .work/build-wheels
      - name: Declare non-Windows applicability
        if: runner.os != 'Windows'
        run: python -c "print('Windows installation and EXE build are not applicable on this runner. Windows wheel verification only.')"
      - name: Validate Windows target installation and PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'build_windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'build_windows.ps1 syntax is invalid' }
          python scripts/check_build_lock.py --target
          if ($LASTEXITCODE -ne 0) { throw 'Windows target check failed' }
          $venv = Join-Path $PWD '.work/build-deps-env'
          try {
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
            $buildPython = Join-Path $venv 'Scripts/python.exe'
            & $buildPython -m pip --isolated --disable-pip-version-check install --no-index --find-links .work/build-wheels --require-hashes --only-binary=:all: -r requirements-build.txt
            if ($LASTEXITCODE -ne 0) { throw 'Locked installation failed' }
            & $buildPython -m pip --isolated --disable-pip-version-check check
            if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency failed' }
            & $buildPython -I scripts/check_build_lock.py --installed
            if ($LASTEXITCODE -ne 0) { throw 'Installed versions differ from lock' }
            & $buildPython -m PyInstaller --version
            if ($LASTEXITCODE -ne 0) { throw 'PyInstaller import/version check failed' }
          } finally {
            if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          }
