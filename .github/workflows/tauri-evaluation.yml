name: Tauri unwired evaluation package
on:
  pull_request:
    branches: [main]
    paths: ['ui/tauri/**', 'tools/native-driver-trace/**', 'scripts/*driver_trace.py', 'scripts/*tauri*.py', 'scripts/tests/test_tauri_evaluation_*.py', 'docs/tauri-evaluation*', '.github/workflows/tauri-evaluation.yml']
  push:
    branches: [main]
    paths: ['ui/tauri/**', 'tools/native-driver-trace/**', 'scripts/*driver_trace.py', 'scripts/*tauri*.py', 'scripts/tests/test_tauri_evaluation_*.py', 'docs/tauri-evaluation*', '.github/workflows/tauri-evaluation.yml']
permissions:
  contents: read
concurrency:
  group: tauri-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-evaluation:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Record fixed source and test archive boundary
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'SOURCE_SHA_INVALID' }
          "EVALUATION_SOURCE_SHA=$sha" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/tauri-evaluation-target" >> $env:GITHUB_ENV
          python -B -m unittest discover -s scripts/tests -p 'test_tauri_evaluation_*.py' -v
          exit $LASTEXITCODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Build locked frontend with runtime notices
        working-directory: ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/notices.mjs --check
          exit $LASTEXITCODE
      - name: Select fixed official Rust in disposable CI
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Read locked Cargo metadata before compiling
        working-directory: ui/tauri
        run: |
          cargo +1.99.1 metadata --locked --format-version 1 --features custom-protocol --filter-platform x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml > "$env:RUNNER_TEMP/cargo-metadata.json"
          exit $LASTEXITCODE
      - name: Collect complete dependency license texts before compiling
        run: |
          $sysroot = (rustc +1.99.1 --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath "$sysroot/share/doc/rust" -File | Select-Object -ExpandProperty Name
          python -B scripts/collect_tauri_licenses.py --metadata "$env:RUNNER_TEMP/cargo-metadata.json" --frontend-notice ui/tauri/dist/THIRD_PARTY_NOTICES.txt --rust-docs "$sysroot/share/doc/rust" --output "$env:RUNNER_TEMP/evaluation-licenses"
          exit $LASTEXITCODE
      - name: Build locked release executable
        working-directory: ui/tauri
        run: cargo +1.99.1 build --release --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Create source-bound evaluation archive
        run: |
          $exe = "$env:CARGO_TARGET_DIR/release/rescue-host-shell.exe"
          if ((Get-AuthenticodeSignature $exe).Status -ne 'NotSigned') { throw 'UNEXPECTED_SIGNATURE_STATE' }
          python -B scripts/package_tauri_evaluation.py --exe $exe --licenses "$env:RUNNER_TEMP/evaluation-licenses" --source-sha $env:EVALUATION_SOURCE_SHA --output "$env:RUNNER_TEMP/evaluation-package"
          exit $LASTEXITCODE
      - name: Extract the exact distribution ZIP and check every file hash
        run: |
          $zip = "$env:RUNNER_TEMP/evaluation-package/RescueHostTauriUnwiredEvaluation-x64.zip"
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "$env:CARGO_TARGET_DIR/release/rescue-host-shell.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B scripts/verify_tauri_evaluation.py --archive $zip --source $env:EVALUATION_SOURCE_SHA --archive-sha256 $zipHash --exe-sha256 $exeHash > "$env:RUNNER_TEMP/evaluation-package/verification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/evaluation-unpacked"
          $root = "$env:RUNNER_TEMP/evaluation-unpacked/RescueHostTauriUnwiredEvaluation"
          $manifest = Get-Content "$root/MANIFEST.json" -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:EVALUATION_SOURCE_SHA -or $manifest.integration -ne 'not_connected' -or $manifest.canStart -or $manifest.canStop -or -not $manifest.productionGateClosed) { throw 'PACKAGE_BOUNDARY_MISMATCH' }
          foreach ($file in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash (Join-Path $root $file.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value) { throw 'PACKAGE_FILE_HASH_MISMATCH' }
          }
      - name: Read existing CI WebView2 without updating it
        run: ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:RUNNER_TEMP/evaluation-inventory.json"
      - name: Prepare existing pinned native test tools in runner temp
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:RUNNER_TEMP/evaluation-tools" -InventoryPath "$env:RUNNER_TEMP/evaluation-inventory.json"
      - name: Launch extracted release EXE and observe UI, IPC and normal close
        timeout-minutes: 3
        run: ./ui/tauri/native-smoke/supervise.ps1 -ToolsDirectory "$env:RUNNER_TEMP/evaluation-tools" -OutputDirectory "$env:RUNNER_TEMP/evaluation-evidence" -ApplicationPath "$env:RUNNER_TEMP/evaluation-unpacked/RescueHostTauriUnwiredEvaluation/rescue-host-shell.exe"
      - name: Validate anonymous driver stages and provenance
        if: always()
        timeout-minutes: 1
        run: ./ui/tauri/native-smoke/inspect-driver-trace.ps1 -ToolsDirectory "$env:RUNNER_TEMP/evaluation-tools" -OutputDirectory "$env:RUNNER_TEMP/evaluation-evidence"
      - name: Save validated internal evaluation ZIP and separate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tauri-unwired-windows-x64-evaluation
          path: |
            ${{ runner.temp }}/evaluation-package/*
            ${{ runner.temp }}/evaluation-evidence/*.json
            ${{ runner.temp }}/evaluation-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Save failure evidence without distributing a failed candidate
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tauri-evaluation-failure-evidence
          path: |
            ${{ runner.temp }}/evaluation-evidence/*.json
            ${{ runner.temp }}/evaluation-inventory.json
          if-no-files-found: ignore
          retention-days: 7
