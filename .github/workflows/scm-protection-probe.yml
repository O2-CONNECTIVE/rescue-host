name: SCM protection probe source

on:
  pull_request:
    branches: [main]
    paths: ['experiments/scm-initial-protection/**', '.github/workflows/scm-protection-probe.yml']
  push:
    branches: [main]
    paths: ['experiments/scm-initial-protection/**', '.github/workflows/scm-protection-probe.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Probe source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      GOFLAGS: ''
    defaults:
      run:
        working-directory: experiments/scm-initial-protection
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: x64
          cache: false
      - name: Download fixed module
        run: go mod download
      - name: Verify fixed module
        run: go mod verify
      - name: Pure runner tests
        run: go test -count=1 -timeout=30s ./...
      - name: Vet source
        run: go vet ./...
      - name: Pure runner race tests
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Parse PowerShell and compile wrapper without invoking it
        if: runner.os == 'Windows'
        shell: powershell
        run: ./check-setup-source.ps1
      - name: Cross compile both Windows architectures without running the executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false -o /tmp/probe-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -o /tmp/probe-arm64.exe .
