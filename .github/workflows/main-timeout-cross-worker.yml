name: Fixed main cross-runner worker
on:
  workflow_call:
    inputs:
      label: { required: true, type: string }
      artifact_id: { required: true, type: string }
      artifact_digest: { required: true, type: string }
      zip_sha: { required: true, type: string }
      exe_sha: { required: true, type: string }
      driver_sha: { required: true, type: string }
      provenance_sha: { required: true, type: string }
      licenses_sha: { required: true, type: string }
      manifest_sha: { required: true, type: string }
    outputs:
      ok:
        value: ${{ jobs.compare.outputs.ok }}
      trials:
        value: ${{ jobs.compare.outputs.trials }}
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 35
    outputs:
      ok: ${{ steps.certify.outputs.ok }}
      trials: ${{ steps.certify.outputs.trials }}
    defaults:
      run:
        working-directory: source
    env:
      EXPECTED_ZIP: ${{ inputs.zip_sha }}
      EXPECTED_EXE: ${{ inputs.exe_sha }}
      EXPECTED_DRIVER: ${{ inputs.driver_sha }}
      EXPECTED_PROVENANCE: ${{ inputs.provenance_sha }}
      EXPECTED_LICENSES: ${{ inputs.licenses_sha }}
      EXPECTED_MANIFEST: ${{ inputs.manifest_sha }}
      EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
      EXPECTED_ID: ${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 1eda7a4e964d34a751dcc89509ee07b3482917a7
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Create owned root and initialize both outcomes
        run: |
          $id = [Guid]::NewGuid().ToString('D').ToLowerInvariant()
          $root = Join-Path $env:RUNNER_TEMP ("cross-repro-" + $id)
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          "REPRO_ROOT=$root" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$root/target" >> $env:GITHUB_ENV
          $initial = [ordered]@{schema=1; rootCleanup='not-attempted'; trials=@(1..2 | ForEach-Object { [ordered]@{trial=$_; outcome='not-started'; sessionOutcome='not-started'; sessionMs=$null; normalClose=$null; driverTrace='not-started'; cleanup='not-started'} })}
          [IO.File]::WriteAllText((Join-Path $root 'two-trials.json'), ($initial | ConvertTo-Json -Depth 6 -Compress))
      - name: Bind same-run artifact ID and producer digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EXPECTED_ID -cnotmatch '^[1-9][0-9]*$' -or $env:EXPECTED_DIGEST -cnotmatch '^[0-9a-f]{64}$') { throw 'ARTIFACT_ID_INVALID' }
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:EXPECTED_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$artifact.id -cne $env:EXPECTED_ID -or [string]$artifact.workflow_run.id -cne $env:GITHUB_RUN_ID -or $artifact.expired -ne $false -or $artifact.digest -cne ("sha256:" + $env:EXPECTED_DIGEST)) { throw 'ARTIFACT_PROVENANCE_MISMATCH' }
      - name: Download producer artifact by ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ env.REPRO_ROOT }}/payload
          digest-mismatch: error
      - name: Verify fixed payload against independent producer outputs
        run: |
          if ($env:EXPECTED_ID -cnotmatch '^[1-9][0-9]*$' -or $env:EXPECTED_DIGEST -cnotmatch '^[0-9a-f]{64}$') { throw 'ARTIFACT_ID_INVALID' }
          foreach ($hash in @($env:EXPECTED_ZIP,$env:EXPECTED_EXE,$env:EXPECTED_DRIVER,$env:EXPECTED_PROVENANCE,$env:EXPECTED_LICENSES,$env:EXPECTED_MANIFEST)) { if ($hash -cnotmatch '^[0-9a-f]{64}$') { throw 'EXPECTED_HASH_INVALID' } }
          $payload = "$env:REPRO_ROOT/payload"
          $expected = @('RescueHostTauriUnwiredEvaluation-x64.zip','tauri-driver.exe','driver-provenance.json','driver-licenses.zip','manifest.json') | Sort-Object
          $items = @(Get-ChildItem -LiteralPath $payload -Force)
          if (@($items | Where-Object { $_.PSIsContainer -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }).Count -ne 0 -or (($items.Name | Sort-Object) -join ',') -cne ($expected -join ',')) { throw 'PAYLOAD_SET_INVALID' }
          foreach ($pair in @(@('RescueHostTauriUnwiredEvaluation-x64.zip',$env:EXPECTED_ZIP),@('tauri-driver.exe',$env:EXPECTED_DRIVER),@('driver-provenance.json',$env:EXPECTED_PROVENANCE),@('driver-licenses.zip',$env:EXPECTED_LICENSES),@('manifest.json',$env:EXPECTED_MANIFEST))) {
            if ((Get-FileHash -LiteralPath (Join-Path $payload $pair[0]) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pair[1]) { throw 'PAYLOAD_HASH_MISMATCH' }
          }
          $manifest = Get-Content "$payload/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 1 -or $manifest.source -cne '1eda7a4e964d34a751dcc89509ee07b3482917a7' -or $manifest.zipSha -cne $env:EXPECTED_ZIP -or $manifest.exeSha -cne $env:EXPECTED_EXE -or $manifest.driverSha -cne $env:EXPECTED_DRIVER -or $manifest.provenanceSha -cne $env:EXPECTED_PROVENANCE -or $manifest.licensesSha -cne $env:EXPECTED_LICENSES) { throw 'PAYLOAD_MANIFEST_MISMATCH' }
          python -B scripts/verify_tauri_evaluation.py --archive "$payload/RescueHostTauriUnwiredEvaluation-x64.zip" --source 1eda7a4e964d34a751dcc89509ee07b3482917a7 --archive-sha256 $env:EXPECTED_ZIP --exe-sha256 $env:EXPECTED_EXE > "$env:REPRO_ROOT/verification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$payload/RescueHostTauriUnwiredEvaluation-x64.zip" -DestinationPath "$env:REPRO_ROOT/evaluation-unpacked"
      - name: Select pinned Rust and inventory without updating WebView
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:REPRO_ROOT/evaluation-inventory.json"
      - name: Fetch official EdgeDriver and fixed driver source
        timeout-minutes: 6
        run: |
          ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:REPRO_ROOT/evaluation-tools" -InventoryPath "$env:REPRO_ROOT/evaluation-inventory.json"
      - name: Use producer driver and verify its provenance
        run: |
          $tools = "$env:REPRO_ROOT/evaluation-tools"
          Copy-Item -LiteralPath "$env:REPRO_ROOT/payload/tauri-driver.exe" -Destination "$tools/tauri/bin/tauri-driver.exe" -Force
          Copy-Item -LiteralPath "$env:REPRO_ROOT/payload/driver-provenance.json" -Destination "$tools/driver-provenance.json" -Force
          if ((Get-FileHash "$tools/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_DRIVER) { throw 'DRIVER_HASH_MISMATCH' }
          $provenance = Get-Content "$tools/driver-provenance.json" -Raw | ConvertFrom-Json
          if ($provenance.binarySha256 -cne $env:EXPECTED_DRIVER) { throw 'DRIVER_PROVENANCE_MISMATCH' }
          if ((Get-FileHash "$env:REPRO_ROOT/evaluation-unpacked/RescueHostTauriUnwiredEvaluation/rescue-host-shell.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_EXE) { throw 'EXE_HASH_MISMATCH' }
      - name: Two fixed isolated sessions with ownership checks
        id: trials
        # 各 trial 最大 180秒 + 検証 60秒の 2 回に、コピーと結果保存の余白を加える。
        timeout-minutes: 10
        run: |
          $root = $env:REPRO_ROOT
          $exe = Join-Path $root 'evaluation-unpacked/RescueHostTauriUnwiredEvaluation/rescue-host-shell.exe'
          $template = Join-Path $root 'evaluation-tools'
          $summaryPath = Join-Path $root 'two-trials.json'
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          function Save-Trials($Value) {
            $temp = $summaryPath + '.tmp-' + [Guid]::NewGuid().ToString('D')
            $backup = $temp + '.bak'
            $replaced = $false
            try {
              [IO.File]::WriteAllText($temp, ($Value | ConvertTo-Json -Depth 8 -Compress))
              [IO.File]::Replace($temp, $summaryPath, $backup)
              $replaced = $true
            } finally {
              if ($replaced) { foreach ($owned in @($temp, $backup)) { if (Test-Path -LiteralPath $owned) { Remove-Item -LiteralPath $owned -Force -ErrorAction SilentlyContinue } } }
            }
          }
          $summary | Add-Member -NotePropertyName exeSha256 -NotePropertyValue (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary | Add-Member -NotePropertyName tauriSha256 -NotePropertyValue (Get-FileHash -LiteralPath "$template/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary | Add-Member -NotePropertyName edgeSha256 -NotePropertyValue (Get-FileHash -LiteralPath "$template/edge/msedgedriver.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($name in @('webview-profile', 'driver-stage.jsonl', 'driver.stdout.log', 'driver.stderr.log', 'test.stdout.log', 'test.stderr.log')) {
            if (Test-Path -LiteralPath (Join-Path $template $name)) { throw 'TEMPLATE_NOT_CLEAN' }
          }
          Save-Trials $summary
          $allPassed = $true
          function Invoke-OwnedPwsh([string[]]$Arguments, [int]$LimitMs) {
            $process = [Diagnostics.Process]::new()
            $process.StartInfo.FileName = (Get-Command pwsh).Source
            $process.StartInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) { [void]$process.StartInfo.ArgumentList.Add($argument) }
            if (-not $process.Start()) { throw 'OWNED_PROCESS_START_FAILED' }
            if (-not $process.WaitForExit($LimitMs)) {
              try { $process.Kill(); [void]$process.WaitForExit(2000) } catch { }
              throw 'OWNED_PROCESS_TIMEOUT'
            }
            return $process.ExitCode
          }
          foreach ($trial in 1..2) {
            $row = $summary.trials[$trial - 1]
            $tools = Join-Path $root "evaluation-trial-$trial-tools"
            $out = Join-Path $root "evaluation-trial-$trial-evidence"
            $row.outcome = 'started'
            $row.sessionOutcome = 'unknown'
            $row.driverTrace = 'unknown'
            $row.cleanup = 'unconfirmed'
            Save-Trials $summary
            try {
              $version = (Get-Content ./ui/tauri/native-smoke/tools.json -Raw | ConvertFrom-Json).tauriDriverVersion
              if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'TRIAL_TOOL_VERSION_INVALID' }
              New-Item -ItemType Directory -Path "$tools/edge", "$tools/tauri/bin" -Force -ErrorAction Stop | Out-Null
              Copy-Item -LiteralPath "$template/edge/msedgedriver.exe" -Destination "$tools/edge/msedgedriver.exe" -ErrorAction Stop
              Copy-Item -LiteralPath "$template/tauri/bin/tauri-driver.exe" -Destination "$tools/tauri/bin/tauri-driver.exe" -ErrorAction Stop
              Copy-Item -LiteralPath "$template/driver-provenance.json", "$template/tauri-driver.crate" -Destination $tools -ErrorAction Stop
              Copy-Item -LiteralPath "$template/tauri-driver-$version" -Destination "$tools/tauri-driver-$version" -Recurse -ErrorAction Stop
              if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.exeSha256 -or
                  (Get-FileHash -LiteralPath "$tools/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.tauriSha256 -or
                  (Get-FileHash -LiteralPath "$tools/edge/msedgedriver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.edgeSha256) { throw 'TRIAL_BINARY_MISMATCH' }
              $exit = Invoke-OwnedPwsh @('-NoProfile', '-NonInteractive', '-File', './ui/tauri/native-smoke/supervise.ps1', '-ToolsDirectory', $tools, '-OutputDirectory', $out, '-ApplicationPath', $exe) 180000
              $report = Get-Content -LiteralPath (Join-Path $out 'native-result.json') -Raw | ConvertFrom-Json
              $timing = Get-Content -LiteralPath (Join-Path $out 'session-startup-timing.json') -Raw | ConvertFrom-Json
              $row.sessionMs = $timing.settledMs
              if ($timing.outcome -in @('success', 'timeout', 'transport', 'other')) { $row.sessionOutcome = $timing.outcome }
              if ($report.normalCloseVerified -is [bool]) { $row.normalClose = $report.normalCloseVerified }
              $row.outcome = if ($exit -eq 0 -and $report.nativeTestsPassed -eq 1 -and $timing.outcome -eq 'success') { 'success' } else { 'failed' }
              $inspectExit = Invoke-OwnedPwsh @('-NoProfile', '-NonInteractive', '-File', './ui/tauri/native-smoke/inspect-driver-trace.ps1', '-ToolsDirectory', $tools, '-OutputDirectory', $out) 60000
              $row.driverTrace = if ($inspectExit -eq 0) { 'pass' } else { 'fail' }
              if ($inspectExit -ne 0) { throw 'TRIAL_EVIDENCE_UNCONFIRMED' }
              if ($report.nativeTestsRun -ne 1 -or $report.nativeTestsPassed -ne 1 -or $report.normalCloseVerified -ne $true -or $report.cleanupFailures -ne 0 -or $report.driverExitObservedAfterCleanup -ne $true) { throw 'TRIAL_CLEANUP_UNCONFIRMED' }
              if (@(Get-NetTCPConnection -State Listen -ErrorAction Stop | Where-Object LocalPort -in @(4444, 4445)).Count -ne 0) { throw 'TRIAL_CLEANUP_UNCONFIRMED' }
              $driverPaths = @((Join-Path $tools 'tauri/bin/tauri-driver.exe'), (Join-Path $tools 'edge/msedgedriver.exe'))
              foreach ($candidate in @(Get-CimInstance Win32_Process -Filter "Name = 'msedgedriver.exe' OR Name = 'tauri-driver.exe'" -ErrorAction Stop)) {
                if (-not $candidate.ExecutablePath -or $candidate.ExecutablePath -in $driverPaths) { throw 'TRIAL_CLEANUP_UNCONFIRMED' }
              }
              if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.exeSha256 -or
                  (Get-FileHash -LiteralPath "$tools/tauri/bin/tauri-driver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.tauriSha256 -or
                  (Get-FileHash -LiteralPath "$tools/edge/msedgedriver.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $summary.edgeSha256) { throw 'TRIAL_BINARY_MISMATCH' }
              $row.cleanup = 'confirmed'
              if ($row.outcome -ne 'success') { $allPassed = $false }
            } catch {
              if ($row.outcome -eq 'started') { $row.outcome = 'failed' }
              $allPassed = $false
              Write-Output 'TRIAL_CLEANUP_UNCONFIRMED'
            } finally {
              Save-Trials $summary
            }
            if ($row.cleanup -ne 'confirmed') { break }
          }
          if (-not $allPassed -or @($summary.trials | Where-Object outcome -eq 'success').Count -ne 2) { exit 1 }
      - name: Verify all required anonymous trial evidence
        id: verify_evidence
        if: always()
        run: |
          $summary = Get-Content "$env:REPRO_ROOT/two-trials.json" -Raw -ErrorAction Stop | ConvertFrom-Json
          if ($summary.schema -ne 1 -or @($summary.trials).Count -ne 2 -or ($summary.trials.trial -join ',') -cne '1,2') { throw 'EVIDENCE_INCOMPLETE' }
          foreach ($row in $summary.trials) {
            if ($row.trial -notin @(1,2)) { throw 'EVIDENCE_INCOMPLETE' }
            if ($row.outcome -eq 'not-started') { continue }
            $out = "$env:REPRO_ROOT/evaluation-trial-$($row.trial)-evidence"
            $names = @('native-observation.json','native-result.json','session-startup-timing.json','driver-provenance.json','driver-stage-report.json')
            if ($row.outcome -eq 'success') { $names += 'webview-result.json' }
            foreach ($name in $names) {
              $item = Get-Item -LiteralPath (Join-Path $out $name) -ErrorAction Stop
              if ($item.PSIsContainer -or $item.Length -le 0 -or $item.Length -gt 65536 -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'EVIDENCE_INCOMPLETE' }
            }
            $trace = Get-Content (Join-Path $out 'driver-stage-report.json') -Raw | ConvertFrom-Json
            if ($trace.diagnostic -ne 'complete' -or $trace.code -cne 'TRACE_COMPLETE') { throw 'EVIDENCE_INCOMPLETE' }
          }
          foreach ($name in @('evaluation-inventory.json','verification.json')) { if (-not (Test-Path -LiteralPath (Join-Path $env:REPRO_ROOT $name) -PathType Leaf)) { throw 'EVIDENCE_INCOMPLETE' } }
      - name: Save anonymous trial evidence
        id: evidence
        if: ${{ always() && steps.verify_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fixed-main-cross-${{ inputs.label }}-evidence
          path: |
            ${{ env.REPRO_ROOT }}/two-trials.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/native-observation.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/native-result.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/session-startup-timing.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/driver-provenance.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/driver-stage-report.json
            ${{ env.REPRO_ROOT }}/evaluation-trial-*/webview-result.json
            ${{ env.REPRO_ROOT }}/evaluation-inventory.json
            ${{ env.REPRO_ROOT }}/verification.json
          if-no-files-found: error
          retention-days: 1
      - name: Certify next runner only after trials and evidence
        id: certify
        if: always()
        env:
          TRIAL_RESULT: ${{ steps.trials.outcome }}
          EVIDENCE_RESULT: ${{ steps.evidence.outcome }}
          EVIDENCE_CHECK: ${{ steps.verify_evidence.outcome }}
        run: |
          $ok = 'false'
          $defaultOutcome = if ($env:TRIAL_RESULT -eq 'skipped') { 'not-started' } else { 'unknown' }
          $rows = @([ordered]@{trial=1;outcome=$defaultOutcome}, [ordered]@{trial=2;outcome=$defaultOutcome})
          try {
            $parsed = Get-Content "$env:REPRO_ROOT/two-trials.json" -Raw | ConvertFrom-Json
            if ($parsed.schema -eq 1 -and @($parsed.trials).Count -eq 2 -and ($parsed.trials.trial -join ',') -ceq '1,2') { $rows = @($parsed.trials) }
          } catch { Write-Output 'TRIAL_SUMMARY_UNAVAILABLE' }
          if ($env:TRIAL_RESULT -eq 'success' -and $env:EVIDENCE_RESULT -eq 'success' -and $env:EVIDENCE_CHECK -eq 'success') {
            $summary = Get-Content "$env:REPRO_ROOT/two-trials.json" -Raw | ConvertFrom-Json
            if ($summary.schema -eq 1 -and @($summary.trials).Count -eq 2 -and @($summary.trials | Where-Object { $_.outcome -eq 'success' -and $_.cleanup -eq 'confirmed' -and $_.normalClose -eq $true -and $_.driverTrace -eq 'pass' }).Count -eq 2) { $ok = 'true' }
          }
          "ok=$ok" >> $env:GITHUB_OUTPUT
          "trials=$($rows | ConvertTo-Json -Depth 6 -Compress)" >> $env:GITHUB_OUTPUT
          Write-Output 'ROOT_NOT_DELETED_RUNNER_DISPOSAL_UNVERIFIED'
