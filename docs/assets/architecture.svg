<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">Rescue Host v0.2.1 の構成と未実装の安全境界</title>
<desc id="desc">実装済みのGUI設定から不変の操作方針へ変換できる。ライフサイクルは独立したオフラインモデル。新規接続は常時拒否。実SSHアダプター、内側sshd制約、保護されたWindows監督は計画のみ。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#346677" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1010" fill="#f4f7fb"/>
<style>text{font-family:'Noto Sans CJK JP','Noto Sans',sans-serif;fill:#1c3045}.heading{font-size:30px;font-weight:700}.section{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.code{font-family:'DejaVu Sans Mono',monospace;font-size:16px}</style>
<text x="44" y="58" class="heading">Rescue Host｜実装と計画の境界</text>
<text x="44" y="91" class="body">v0.2.1-dev  ·  安全性修正候補  ·  実リモート接続は利用不可</text>
<rect x="40" y="120" width="1120" height="418" rx="14" fill="#ffffff" stroke="#cbd6e1" stroke-width="2"/>
<text x="64" y="157" class="section">01  実装済み — 設定とオフライン検証</text>
<rect x="64" y="182" width="320" height="139" rx="14" fill="#eaf4ff" stroke="#719abc" stroke-width="2"/>
<text x="84" y="217" class="section">GUI：操作範囲の選択・保存</text>
<text x="84" y="249" class="body">制限付き / フル操作</text>
<text x="84" y="278" class="body">両方とも管理者昇格なし</text>
<text x="84" y="305" class="code">rescue_host.py / Settings</text>
<rect x="450" y="182" width="346" height="139" rx="14" fill="#eaf7f3" stroke="#60a18a" stroke-width="2"/>
<text x="470" y="217" class="section">変更不能な操作方針</text>
<text x="470" y="249" class="body">宛先・操作ID・方針ダイジェスト</text>
<text x="470" y="278" class="body">TCP：127.0.0.1:22 の完全一致</text>
<text x="470" y="305" class="code">rescue_policy.py</text>
<path d="M385 250 H442" fill="none" stroke="#346677" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820" y="216" class="small">実装済みの変換</text>
<text x="820" y="244" class="code">Settings.</text>
<text x="820" y="269" class="code">to_operation_policy()</text>
<text x="820" y="299" class="small">起動・認可は行わない</text>
<rect x="64" y="345" width="732" height="166" rx="14" fill="#edf4fb" stroke="#719abc" stroke-width="2"/>
<text x="84" y="379" class="section">独立したオフライン・ライフサイクルモデル</text>
<text x="84" y="409" class="body">準備 → 利用可能 → 有効 → 失効中 → 終了</text>
<text x="84" y="440" class="body">同一性 / 最大120分 / リース最長60秒 / 競合・切断再試行</text>
<text x="84" y="474" class="code">rescue_lease.py</text>
<text x="84" y="498" class="small">呼び出し側の定期確認に依存。実SSH・OS境界・独立タイマーなし。</text>
<text x="820" y="383" class="section">検証範囲</text>
<text x="820" y="414" class="small">Linux / Python 3.12.14</text>
<text x="820" y="445" class="small">全82件のオフライン試験</text>
<text x="820" y="475" class="small">実ネットワークの証明ではない</text>
<rect x="40" y="562" width="1120" height="104" rx="14" fill="#fff0ef" stroke="#c54848" stroke-width="2"/>
<text x="64" y="598" class="section" style="fill:#a62e2e">02  開始ゲート：閉鎖中（常時拒否）</text>
<text x="64" y="629" class="body">GUIと起動ワーカーの両方で拒否。モード選択や設定変更で解除できない。</text>
<text x="64" y="653" class="small">上のモデルから下の実ネットワークへ接続する経路は、まだ存在しない。</text>
<rect x="40" y="690" width="1120" height="248" rx="14" fill="#ffffff" stroke="#a1aab6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="64" y="727" class="section">03  計画のみ — 実装・敵対的検証が必要な安全境界</text>
<rect x="64" y="751" width="336" height="155" rx="14" fill="#fff8ec" stroke="#b69050" stroke-width="2" stroke-dasharray="8 6"/>
<text x="80" y="783" class="body">実Upterm / SSHアダプター</text>
<text x="80" y="817" class="small">公開鍵認証・チャネル拒否</text>
<text x="80" y="847" class="small">固定TCP宛先への実接続</text>
<text x="80" y="877" class="small">期限付きの取消・切断処理</text>
<rect x="432" y="751" width="336" height="155" rx="14" fill="#fff8ec" stroke="#b69050" stroke-width="2" stroke-dasharray="8 6"/>
<text x="448" y="783" class="body">内側sshd / 制限付きヘルパー</text>
<text x="448" y="817" class="small">制限付き診断・修復の実体</text>
<text x="448" y="847" class="small">通常ユーザーの操作権限</text>
<text x="448" y="877" class="small">外側TCP制約だけでは代用不可</text>
<rect x="800" y="751" width="336" height="155" rx="14" fill="#fff8ec" stroke="#b69050" stroke-width="2" stroke-dasharray="8 6"/>
<text x="816" y="783" class="body">保護されたWindows監督</text>
<text x="816" y="817" class="small">実行主体の分離・ACL</text>
<text x="816" y="847" class="small">サービス / Job Object / IPC</text>
<text x="816" y="877" class="small">独立した期限執行・再接続拒否</text>
<text x="44" y="974" class="small">凡例：実線＝実装済み（範囲は本文参照） / 赤＝常時拒否 / 破線＝未実装の計画</text>
<text x="44" y="999" class="small">ソース構成の説明図です。実GUIの画面・実接続の動作実績を示すものではありません。</text>
</svg>